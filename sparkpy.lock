# What scripts/setup.sh installs. Release CI rewrites the SPARKPY_* lines (and
# plugin.json's version, which must equal SPARKPY_VERSION).
SPARKPY_VERSION=0.4.0
SPARKPY_WHEEL_URL=
SPARKPY_WHEEL_SHA256=
# The Windows x64 wheel, for the same SPARKPY_VERSION. Empty until one is published: setup
# then says so on Windows.
SPARKPY_WINDOWS_WHEEL_URL=https://downloads.lightcraft.pro/sparkpy/0.4.0/sparkpy-0.4.0-cp313-cp313-win_amd64.whl
SPARKPY_WINDOWS_WHEEL_SHA256=57ccd74960f9fc3874e46a780b74d882885f9bb67cde8ff7af854629f97e26d1
# The oldest macOS the wheel's binaries load on (their LC_BUILD_VERSION minos).
SPARKPY_MIN_MACOS=15
PYTHON_VERSION=3.13
UV_VERSION=0.13.5
UV_SHA256=743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73
UV_WINDOWS_SHA256=a38b8d1902b7cfbc76b423ba1bb456f623f42064cdc72628b6075b89afd1019a
